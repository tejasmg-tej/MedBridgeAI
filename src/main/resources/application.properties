spring.application.name=medbridge-ai

# Loads variables from a local ".env" file (if present) in addition to real environment variables.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---- MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medbridge_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Gemini ----
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-seconds=120

# ---- App ----
medbridge.max-text-chars=60000
